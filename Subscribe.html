<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result Alerts Subscription</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background: transparent;
    color:#fff;
    padding: 8px;
  }
  .sub-wrap {
    background: rgba(20, 35, 55, 0.98);
    border: 1px solid rgba(255, 215, 0, 0.2);
    border-radius: 20px;
    padding: 26px 24px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    box-shadow: 0 25px 50px rgba(0,0,0,0.55);
    position: relative;
  }
  .sub-wrap h3 {
    color: #fbbf24;
    font-size: 20px;
    margin-bottom: 6px;
    text-align: center;
  }
  .sub-wrap .sub-sub {
    color: #cbd5e1;
    font-size: 13px;
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .sub-close-x {
    position: absolute;
    top: 12px;
    right: 14px;
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 10px;
    border-radius: 8px;
    transition: 0.15s;
  }
  .sub-close-x:hover { color:#fff; background: rgba(255,255,255,0.08); }

  .sub-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    background: rgba(255,255,255,0.04);
    padding: 6px;
    border-radius: 12px;
  }
  .sub-tab {
    flex: 1;
    padding: 10px 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #cbd5e1;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid transparent;
    background: transparent;
    font-family: inherit;
  }
  .sub-tab.active {
    background: rgba(139, 92, 246, 0.25);
    color: #fff;
    border-color: rgba(139, 92, 246, 0.5);
  }
  .sub-tab:hover:not(.active) {
    background: rgba(255,255,255,0.06);
    color: #fff;
  }
  .sub-field { margin-bottom: 14px; }
  .sub-field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #f0f4fa;
    margin-bottom: 5px;
  }
  .sub-field label .req { color: #fbbf24; margin-right: 3px; }
  .sub-field select,
  .sub-field input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    font-size: 14px;
    background: rgba(255, 255, 255, 0.10);
    color: #fff;
    transition: 0.2s;
    font-family: inherit;
  }
  .sub-field select option { background: #1a2a3a; color: #fff; }
  .sub-field select:focus,
  .sub-field input:focus {
    outline: none;
    border-color: #fbbf24;
    background: rgba(255, 255, 255, 0.16);
  }
  .sub-field select:disabled,
  .sub-field input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .sub-hint {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 4px;
    display: block;
  }

  /* Loading spinner inside a field */
  .sub-loading-inline {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #cbd5e1;
    margin-top: 6px;
  }
  .sub-loading-inline.show { display: flex; }
  .sub-loading-inline .mini-spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fbbf24;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sub-consent {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin: 14px 0 18px;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .sub-consent input[type="checkbox"] {
    width: 18px; height: 18px;
    margin-top: 1px;
    accent-color: #fbbf24;
    flex-shrink: 0;
    cursor: pointer;
  }
  .sub-consent label {
    font-size: 12.5px;
    color: #d1d9e6;
    line-height: 1.55;
    cursor: pointer;
  }
  .sub-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .sub-btn {
    flex: 1;
    padding: 13px 16px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #fff;
  }
  .sub-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .sub-btn.primary { background: rgba(139, 92, 246, 0.85); }
  .sub-btn.primary:hover:not(:disabled) { background: rgba(139, 92, 246, 1); }
  .sub-btn.secondary { background: rgba(100, 116, 139, 0.5); }
  .sub-btn.secondary:hover:not(:disabled) { background: rgba(100, 116, 139, 0.75); }
  .sub-btn.warn { background: rgba(220, 38, 38, 0.7); }
  .sub-btn.warn:hover:not(:disabled) { background: rgba(220, 38, 38, 0.95); }
  .sub-btn .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  .sub-btn.loading .spinner { display: inline-block; }
  .sub-btn.loading .label { display: none; }

  .sub-msg {
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
    line-height: 1.55;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .sub-msg.show { display: block; }
  .sub-msg.success { background: rgba(34,197,94,0.18); border-left: 4px solid #10b981; color: #dcfce7; }
  .sub-msg.error   { background: rgba(220,38,38,0.18); border-left: 4px solid #ef4444; color: #fecaca; }
  .sub-msg.info    { background: rgba(59,130,246,0.18); border-left: 4px solid #3b82f6; color: #dbeafe; }

  .status-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 14px;
    font-size: 13px;
    color: #e2e8f0;
    line-height: 1.7;
    display: none;
  }
  .status-card.show { display: block; }
  .status-card .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 3px 0;
  }
  .status-card .row .k { color: #94a3b8; }
  .status-card .row .v { color: #fff; font-weight: 600; text-align: right; word-break: break-word; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
  }
  .badge.active { background: rgba(34,197,94,0.25); color: #86efac; border: 1px solid rgba(34,197,94,0.4); }
  .badge.inactive { background: rgba(148,163,184,0.2); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.35); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="sub-wrap">
  <button class="sub-close-x" onclick="closeSubscribeModal()" title="Close">×</button>
  <h3>📬 Result Alerts</h3>
  <div class="sub-sub">
    Subscribe to receive an email the moment your child's results are published for a term.
  </div>

  <div class="sub-tabs">
    <button class="sub-tab active" data-tab="subscribe" onclick="switchSubTab('subscribe')">Subscribe</button>
    <button class="sub-tab" data-tab="manage" onclick="switchSubTab('manage')">Manage</button>
  </div>

  <!-- ================= SUBSCRIBE TAB ================= -->
  <div id="tab-subscribe">
    <div class="sub-field">
      <label><span class="req">*</span> Term:</label>
      <select id="subTerm"><option value="" disabled selected>Loading terms...</option></select>
    </div>

    <div class="sub-field">
      <label><span class="req">*</span> Class:</label>
      <select id="subClass" disabled>
        <option value="" disabled selected>-- Select Term first --</option>
      </select>
    </div>

    <div class="sub-field">
      <label><span class="req">*</span> Student Full Name:</label>
      <select id="subName" disabled>
        <option value="" disabled selected>-- Select Class first --</option>
      </select>
      <div id="subNamesLoading" class="sub-loading-inline">
        <span class="mini-spinner"></span>
        <span id="subNamesLoadingText">Loading student list...</span>
      </div>
    </div>

    <div class="sub-field">
      <label><span class="req">*</span> Date of Birth:</label>
      <input type="date" id="subDob">
      <small class="sub-hint">Use the same date on the school's records (YYYY-MM-DD).</small>
    </div>

    <div class="sub-field">
      <label><span class="req">*</span> Parent/Guardian Email:</label>
      <input type="email" id="subEmail" placeholder="parent@example.com" autocomplete="off">
    </div>

    <div class="sub-consent">
      <input type="checkbox" id="subConsent">
      <label for="subConsent">
        I agree to receive result alert emails from the school for this student. I understand I can unsubscribe at any time.
      </label>
    </div>

    <div class="sub-actions">
      <button class="sub-btn secondary" onclick="closeSubscribeModal()">
        <span class="label">Cancel</span>
      </button>
      <button class="sub-btn primary" id="subSubmitBtn" onclick="submitSubscription()">
        <span class="spinner"></span>
        <span class="label">Subscribe</span>
      </button>
    </div>

    <div id="subMessage" class="sub-msg"></div>
  </div>

  <!-- ================= MANAGE TAB ================= -->
  <div id="tab-manage" class="hidden">
    <div class="sub-field">
      <label><span class="req">*</span> Term:</label>
      <select id="mgTerm"><option value="" disabled selected>Loading terms...</option></select>
    </div>

    <div class="sub-field">
      <label><span class="req">*</span> Class:</label>
      <select id="mgClass" disabled>
        <option value="" disabled selected>-- Select Term first --</option>
      </select>
    </div>

    <div class="sub-field">
      <label><span class="req">*</span> Student Full Name:</label>
      <select id="mgName" disabled>
        <option value="" disabled selected>-- Select Class first --</option>
      </select>
      <div id="mgNamesLoading" class="sub-loading-inline">
        <span class="mini-spinner"></span>
        <span id="mgNamesLoadingText">Loading student list...</span>
      </div>
    </div>

    <div class="sub-field">
      <label><span class="req">*</span> Date of Birth:</label>
      <input type="date" id="mgDob">
    </div>

    <div class="sub-actions">
      <button class="sub-btn secondary" id="mgCheckBtn" onclick="checkSubscriptionStatus()">
        <span class="spinner"></span>
        <span class="label">🔍 Check Status</span>
      </button>
      <button class="sub-btn warn" id="mgUnsubBtn" onclick="confirmUnsubscribe()">
        <span class="spinner"></span>
        <span class="label">✖ Unsubscribe</span>
      </button>
    </div>

    <div id="mgMessage" class="sub-msg"></div>
    <div id="mgStatusCard" class="status-card"></div>
  </div>
</div>

<script>
  // ============================================================
  // Bridge to parent (index.html) — same origin on GitHub Pages
  // ============================================================
  function gasCall(action, params) {
    if (window.parent && typeof window.parent.gasCall === 'function') {
      return window.parent.gasCall(action, params || {});
    }
    return Promise.reject(new Error('gasCall bridge unavailable. Open this page inside the portal.'));
  }

  function closeSubscribeModal() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'closeSubscribeModal' }, '*');
    }
  }

  // ============================================================
  // Class list — must match the sheet IDs in TERM_CONFIG
  // ============================================================
  var ALL_CLASSES = [
    'Form 1', 'Form 2', 'Form 3', 'Form 4',
    'Form 1 ODL', 'Form 2 ODL', 'Form 3 ODL', 'Form 4 ODL'
  ];

  var availableTerms = [];

  // ============================================================
  // UI state
  // ============================================================
  function switchSubTab(tab) {
    document.querySelectorAll('.sub-tab').forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.getElementById('tab-subscribe').classList.toggle('hidden', tab !== 'subscribe');
    document.getElementById('tab-manage').classList.toggle('hidden', tab !== 'manage');
    hideMsg('subMessage');
    hideMsg('mgMessage');
    document.getElementById('mgStatusCard').classList.remove('show');
  }

  function hideMsg(id) {
    var el = document.getElementById(id);
    el.classList.remove('show', 'success', 'error', 'info');
    el.textContent = '';
  }

  function showMsg(id, type, text) {
    var el = document.getElementById(id);
    el.className = 'sub-msg show ' + type;
    el.textContent = text;
  }

  function setBtnLoading(id, on) {
    var b = document.getElementById(id);
    if (!b) return;
    b.classList.toggle('loading', on);
    b.disabled = on;
  }

  function toggleInlineLoading(id, on, text) {
    var el = document.getElementById(id);
    if (!el) return;
    if (text) {
      var txt = el.querySelector('span:not(.mini-spinner)');
      if (txt) txt.textContent = text;
    }
    el.classList.toggle('show', !!on);
  }

  // ============================================================
  // Term dropdowns
  // ============================================================
  function populateTermSelects(terms) {
    availableTerms = terms || [];
    ['subTerm', 'mgTerm'].forEach(function (id) {
      var sel = document.getElementById(id);
      if (!sel) return;
      sel.innerHTML = '<option value="" disabled selected>-- Select Term --</option>';
      availableTerms.forEach(function (t) {
        var o = document.createElement('option');
        o.value = t.key;
        o.textContent = t.display;
        if (t.isActive) o.selected = true;
        sel.appendChild(o);
      });
    });
    // Auto-init class dropdowns now that a default term may be selected
    refreshClassDropdown('subTerm', 'subClass');
    refreshClassDropdown('mgTerm', 'mgClass');
  }

  // Rebuild class dropdown for the selected term, restricted to classes
  // that actually have a sheet configured for that term.
  function refreshClassDropdown(termSelectId, classSelectId) {
    var termSel = document.getElementById(termSelectId);
    var classSel = document.getElementById(classSelectId);
    if (!termSel || !classSel) return;

    var termKey = termSel.value;
    classSel.innerHTML = '';
    if (!termKey) {
      var o0 = document.createElement('option');
      o0.value = ''; o0.disabled = true; o0.selected = true;
      o0.textContent = '-- Select Term first --';
      classSel.appendChild(o0);
      classSel.disabled = true;
      return;
    }

    var termMeta = availableTerms.find(function (t) { return t.key === termKey; });
    // If server told us the classes available, use them; otherwise show all.
    var classList = (termMeta && Array.isArray(termMeta.classes) && termMeta.classes.length)
      ? termMeta.classes
      : ALL_CLASSES;

    var defaultOpt = document.createElement('option');
    defaultOpt.value = ''; defaultOpt.disabled = true; defaultOpt.selected = true;
    defaultOpt.textContent = '-- Select Class --';
    classSel.appendChild(defaultOpt);

    classList.forEach(function (c) {
      var o = document.createElement('option');
      o.value = c;
      o.textContent = c;
      classSel.appendChild(o);
    });
    classSel.disabled = false;
  }

  // Listen for parent pushing the terms list
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type === 'termsPayload' && Array.isArray(d.terms)) {
      populateTermSelects(d.terms);
    }
  });

  // Ask parent for terms on load
  function requestTerms() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'requestTerms' }, '*');
    }
  }
  window.addEventListener('load', function () {
    setTimeout(requestTerms, 50);
  });

  // ============================================================
  // Term/class change wiring
  // ============================================================
  document.getElementById('subTerm').addEventListener('change', function () {
    refreshClassDropdown('subTerm', 'subClass');
    resetStudentDropdown('subName');
  });
  document.getElementById('subClass').addEventListener('change', function () {
    loadStudentNames('subTerm', 'subClass', 'subName', 'subNamesLoading');
  });
  document.getElementById('mgTerm').addEventListener('change', function () {
    refreshClassDropdown('mgTerm', 'mgClass');
    resetStudentDropdown('mgName');
  });
  document.getElementById('mgClass').addEventListener('change', function () {
    loadStudentNames('mgTerm', 'mgClass', 'mgName', 'mgNamesLoading');
  });

  function resetStudentDropdown(studentSelectId) {
    var sel = document.getElementById(studentSelectId);
    if (!sel) return;
    sel.innerHTML = '';
    var o = document.createElement('option');
    o.value = ''; o.disabled = true; o.selected = true;
    o.textContent = '-- Select Class first --';
    sel.appendChild(o);
    sel.disabled = true;
  }

  // ============================================================
  // Load student names for the selected class + term
  // ============================================================
  async function loadStudentNames(termSelId, classSelId, studentSelId, loadingId) {
    var termKey = document.getElementById(termSelId).value;
    var cls = document.getElementById(classSelId).value;
    var sel = document.getElementById(studentSelId);

    resetStudentDropdown(studentSelId);

    if (!termKey || !cls) return;

    // Show loading
    sel.disabled = true;
    toggleInlineLoading(loadingId, true, 'Loading ' + cls + ' students...');

    try {
      var names = await gasCall('getStudentNames', {
        studentClass: cls,
        term: termKey
      });

      if (Array.isArray(names) && names.length > 0) {
        sel.innerHTML = '';
        var def = document.createElement('option');
        def.value = ''; def.disabled = true; def.selected = true;
        def.textContent = '-- Select Student (' + names.length + ' available) --';
        sel.appendChild(def);

        names.forEach(function (n) {
          var o = document.createElement('option');
          o.value = n;
          o.textContent = n;
          sel.appendChild(o);
        });
        sel.disabled = false;
        toggleInlineLoading(loadingId, false);
      } else {
        sel.innerHTML = '';
        var o = document.createElement('option');
        o.value = ''; o.disabled = true; o.selected = true;
        o.textContent = '-- No students found --';
        sel.appendChild(o);
        sel.disabled = true;
        toggleInlineLoading(loadingId, false);
      }
    } catch (e) {
      sel.innerHTML = '';
      var o = document.createElement('option');
      o.value = ''; o.disabled = true; o.selected = true;
      o.textContent = '-- Failed to load: ' + e.message + ' --';
      sel.appendChild(o);
      sel.disabled = true;
      toggleInlineLoading(loadingId, false);
    }
  }

  // ============================================================
  // Subscribe
  // ============================================================
  async function submitSubscription() {
    hideMsg('subMessage');
    var name    = document.getElementById('subName').value;
    var cls     = document.getElementById('subClass').value;
    var dob     = document.getElementById('subDob').value;
    var email   = document.getElementById('subEmail').value.trim();
    var term    = document.getElementById('subTerm').value;
    var consent = document.getElementById('subConsent').checked;

    if (!name || !cls || !dob || !email || !term) {
      showMsg('subMessage', 'error', 'Please fill in all required fields.');
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showMsg('subMessage', 'error', 'Please enter a valid email address.');
      return;
    }
    if (!consent) {
      showMsg('subMessage', 'error', 'Please tick the consent checkbox to continue.');
      return;
    }

    setBtnLoading('subSubmitBtn', true);
    try {
      var res = await gasCall('subscribeResultEmail', {
        studentName: name,
        studentClass: cls,
        dateOfBirth: dob,
        parentEmail: email,
        term: term,
        consent: 'true'
      });
      if (res && res.success) {
        showMsg('subMessage', 'success', res.message || 'Subscription saved.');
        document.getElementById('subDob').value = '';
        document.getElementById('subEmail').value = '';
        document.getElementById('subConsent').checked = false;
      } else {
        showMsg('subMessage', 'error', (res && res.error) || 'Subscription failed.');
      }
    } catch (e) {
      showMsg('subMessage', 'error', 'Error: ' + e.message);
    } finally {
      setBtnLoading('subSubmitBtn', false);
    }
  }

  // ============================================================
  // Check status
  // ============================================================
  async function checkSubscriptionStatus() {
    hideMsg('mgMessage');
    var card = document.getElementById('mgStatusCard');
    card.classList.remove('show');

    var name = document.getElementById('mgName').value;
    var cls  = document.getElementById('mgClass').value;
    var dob  = document.getElementById('mgDob').value;
    var term = document.getElementById('mgTerm').value;

    if (!name || !cls || !dob || !term) {
      showMsg('mgMessage', 'error', 'Please fill in all required fields.');
      return;
    }

    setBtnLoading('mgCheckBtn', true);
    try {
      var res = await gasCall('getResultSubscriptionStatus', {
        studentName: name,
        studentClass: cls,
        dateOfBirth: dob,
        term: term
      });
      if (res && res.success) {
        showMsg('mgMessage', 'info', 'Status loaded below.');
        var status = (res.emailStatus || 'NONE').toUpperCase();
        var badgeClass = status === 'ACTIVE' ? 'active' : 'inactive';
        var emails = (res.allEmails && res.allEmails.length) ? res.allEmails.join(', ') : '—';
        card.innerHTML = ''
          + '<div class="row"><span class="k">Student</span><span class="v">' + escapeHtml(res.studentName) + '</span></div>'
          + '<div class="row"><span class="k">Status</span><span class="v"><span class="badge ' + badgeClass + '">' + escapeHtml(status) + '</span></span></div>'
          + '<div class="row"><span class="k">Emails on file</span><span class="v">' + escapeHtml(emails) + '</span></div>'
          + '<div class="row"><span class="k">Email count</span><span class="v">' + (res.emailCount || 0) + '</span></div>'
          + (res.consentDate ? '<div class="row"><span class="k">Consent given</span><span class="v">' + formatDate(res.consentDate) + '</span></div>' : '')
          + (res.lastResultEmailSent ? '<div class="row"><span class="k">Last alert sent</span><span class="v">' + formatDate(res.lastResultEmailSent) + '</span></div>' : '');
        card.classList.add('show');
      } else {
        showMsg('mgMessage', 'error', (res && res.error) || 'Not found.');
      }
    } catch (e) {
      showMsg('mgMessage', 'error', 'Error: ' + e.message);
    } finally {
      setBtnLoading('mgCheckBtn', false);
    }
  }

  // ============================================================
  // Unsubscribe
  // ============================================================
  async function confirmUnsubscribe() {
    hideMsg('mgMessage');
    var name = document.getElementById('mgName').value;
    var cls  = document.getElementById('mgClass').value;
    var dob  = document.getElementById('mgDob').value;
    var term = document.getElementById('mgTerm').value;

    if (!name || !cls || !dob || !term) {
      showMsg('mgMessage', 'error', 'Please fill in all required fields.');
      return;
    }
    if (!confirm('Unsubscribe "' + name + '" from all result alert emails?')) return;

    setBtnLoading('mgUnsubBtn', true);
    try {
      var res = await gasCall('unsubscribeResultEmail', {
        studentName: name,
        studentClass: cls,
        dateOfBirth: dob,
        term: term
      });
      if (res && res.success) {
        showMsg('mgMessage', 'success', res.message || 'Unsubscribed.');
        document.getElementById('mgStatusCard').classList.remove('show');
      } else {
        showMsg('mgMessage', 'error', (res && res.error) || 'Failed to unsubscribe.');
      }
    } catch (e) {
      showMsg('mgMessage', 'error', 'Error: ' + e.message);
    } finally {
      setBtnLoading('mgUnsubBtn', false);
    }
  }

  // ============================================================
  // Utilities
  // ============================================================
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function formatDate(iso) {
    try {
      var d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleString();
    } catch (e) { return iso; }
  }
</script>
</body>
</html>
