<script>
  // ============================================================
  // Config — plain /exec URL, JSONP only
  // ============================================================
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwSe_HeUAigVjBiN-rmcq0FPiJRKsLBBtw2VGGhLWlMCrIvT3WeQ0MpjdMdI4HDGnkbZQ/exec';

  const ALL_CLASSES = [
    'Form 1','Form 2','Form 3','Form 4',
    'Form 1 ODL','Form 2 ODL','Form 3 ODL','Form 4 ODL'
  ];

  // ============================================================
  // State
  // ============================================================
  const state = {
    adminPassword: null,
    teachers: [],
    assignments: [],
    audit: [],
    subjectsCache: {},
    terms: [],
    bulkSelected: new Set()
  };

  // ============================================================
  // API caller — assignment-form JSONP
  // ============================================================
  function callGAS(action, params, retryCount) {
    retryCount = retryCount || 0;
    const MAX = 3;
    return new Promise((resolve, reject) => {
      const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const globalName = '__gasResponse_' + cb;
      const p = Object.assign({}, params || {});
      p.action = action;
      p.callback = cb;

      const url = GAS_URL + '?' + Object.keys(p)
        .filter(k => p[k] !== undefined && p[k] !== null)
        .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(p[k]))
        .join('&');

      const s = document.createElement('script');
      s.src = url;

      const to = setTimeout(() => {
        cleanup();
        if (retryCount < MAX) resolve(callGAS(action, params, retryCount + 1));
        else reject(new Error('Request timeout'));
      }, 25000);

      function cleanup() {
        clearTimeout(to);
        try { delete window[globalName]; } catch (e) { window[globalName] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
      }

      s.onload = () => {
        setTimeout(() => {
          if (window[globalName] !== undefined) {
            const r = window[globalName];
            cleanup();
            if (r && r.error) {
              reject(new Error(r.error));
            } else {
              resolve(r);
            }
          } else {
            cleanup();
            if (retryCount < MAX) resolve(callGAS(action, params, retryCount + 1));
            else reject(new Error('No response from server (callback may have been stripped)'));
          }
        }, 20);
      };

      s.onerror = () => {
        cleanup();
        if (retryCount < MAX) resolve(callGAS(action, params, retryCount + 1));
        else reject(new Error('Network error'));
      };

      document.head.appendChild(s);
    });
  }

  // ============================================================
  // Utilities
  // ============================================================
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function showMsg(id, type, text) {
    const el = document.getElementById(id);
    el.className = 'msg show ' + type;
    el.textContent = text;
  }
  function hideMsg(id) {
    document.getElementById(id).className = 'msg';
    document.getElementById(id).textContent = '';
  }

  // ============================================================
  // Password handling
  // ============================================================
  function ensurePassword() {
    if (state.adminPassword) return true;
    const cached = sessionStorage.getItem('adminPw');
    if (cached) {
      state.adminPassword = cached;
      return true;
    }
    const p = prompt('Enter admin password:');
    if (!p) return false;
    state.adminPassword = p;
    sessionStorage.setItem('adminPw', p);
    return true;
  }

  // ============================================================
  // Tab switching
  // ============================================================
  function switchTab(t) {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    ['teachers','assign','bulk','audit'].forEach(x => {
      document.getElementById('tab-' + x).classList.toggle('hidden', x !== t);
    });
    if (t === 'teachers' && !state.teachers.length) loadTeachers();
    if (t === 'assign' && !state.assignments.length) loadAssignments();
    if (t === 'bulk') initBulkTab();
    if (t === 'audit' && !state.audit.length) loadAudit();
  }

  // ============================================================
  // TEACHERS
  // ============================================================
  async function loadTeachers(force) {
    if (!ensurePassword()) return;
    hideMsg('teachersMsg');
    if (!force && state.teachers.length) { renderTeachers(); return; }
    try {
      const res = await callGAS('adminListTeachers', { password: state.adminPassword });
      if (!res || !res.success) {
        showMsg('teachersMsg', 'error', (res && res.error) || 'Failed.');
        return;
      }
      state.teachers = res.teachers || [];
      const dl = document.getElementById('teacherEmailList');
      dl.innerHTML = '';
      state.teachers.filter(t => t.status === 'ACTIVE').forEach(t => {
        const o = document.createElement('option');
        o.value = t.email;
        o.label = t.name;
        dl.appendChild(o);
      });
      renderTeachers();
    } catch (e) {
      showMsg('teachersMsg', 'error', 'Error: ' + e.message);
    }
  }

  function renderTeachers() {
    const q = (document.getElementById('teacherSearch').value || '').toLowerCase().trim();
    const status = document.getElementById('teacherStatusFilter').value;
    const rows = state.teachers.filter(t => {
      if (status && t.status !== status) return false;
      if (!q) return true;
      return (t.email + ' ' + t.name).toLowerCase().indexOf(q) !== -1;
    });

    if (!rows.length) {
      document.getElementById('teachersTableWrap').innerHTML =
        '<div class="empty">No teachers match your filter.</div>';
      return;
    }

    let h = '<div class="table-wrap"><table><thead><tr>';
    h += '<th>Name</th><th>Email</th><th>Status</th><th>Last Login</th><th style="width:200px;">Actions</th>';
    h += '</tr></thead><tbody>';
    rows.forEach(t => {
      const active = t.status === 'ACTIVE';
      h += '<tr>';
      h += '<td><strong>' + esc(t.name) + '</strong></td>';
      h += '<td style="font-size:12.5px;">' + esc(t.email) + '</td>';
      h += '<td><span class="badge ' + (active ? 'active' : 'inactive') + '">' + esc(t.status) + '</span></td>';
      h += '<td style="font-size:12px;color:#94a3b8;">' + (t.lastLogin ? new Date(t.lastLogin).toLocaleString() : '—') + '</td>';
      h += '<td>';
      if (active) {
        h += '<button class="btn red sm" onclick="deactivateTeacher(\'' + esc(t.email) + '\')">Deactivate</button> ';
      } else {
        h += '<button class="btn green sm" onclick="reactivateTeacher(\'' + esc(t.email) + '\')">Reactivate</button> ';
      }
      h += '<button class="btn purple sm" onclick="jumpToAssignments(\'' + esc(t.email) + '\')">Assign</button>';
      h += '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    document.getElementById('teachersTableWrap').innerHTML = h;
  }

  async function addTeacher() {
    if (!ensurePassword()) return;
    hideMsg('teachersMsg');
    const email = document.getElementById('newTeacherEmail').value.trim();
    const name = document.getElementById('newTeacherName').value.trim();
    if (!email || !name) {
      showMsg('teachersMsg', 'error', 'Both email and name are required.');
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showMsg('teachersMsg', 'error', 'Please enter a valid email address.');
      return;
    }
    try {
      const res = await callGAS('adminAddTeacher', {
        password: state.adminPassword, email, name
      });
      if (!res || !res.success) {
        showMsg('teachersMsg', 'error', (res && res.error) || 'Failed.');
        return;
      }
      showMsg('teachersMsg', 'success', res.created ? 'Teacher added.' : 'Teacher updated.');
      document.getElementById('newTeacherEmail').value = '';
      document.getElementById('newTeacherName').value = '';
      await loadTeachers(true);
    } catch (e) {
      showMsg('teachersMsg', 'error', 'Error: ' + e.message);
    }
  }

  async function deactivateTeacher(email) {
    if (!ensurePassword()) return;
    if (!confirm('Deactivate ' + email + '?\n\nThey will not be able to sign in until reactivated.')) return;
    try {
      const res = await callGAS('adminRemoveTeacher', { password: state.adminPassword, email });
      if (!res || !res.success) {
        showMsg('teachersMsg', 'error', (res && res.error) || 'Failed.');
        return;
      }
      showMsg('teachersMsg', 'success', res.message || 'Deactivated.');
      await loadTeachers(true);
    } catch (e) {
      showMsg('teachersMsg', 'error', 'Error: ' + e.message);
    }
  }

  async function reactivateTeacher(email) {
    if (!ensurePassword()) return;
    try {
      const res = await callGAS('adminReactivateTeacher', { password: state.adminPassword, email });
      if (!res || !res.success) {
        showMsg('teachersMsg', 'error', (res && res.error) || 'Failed.');
        return;
      }
      showMsg('teachersMsg', 'success', res.message || 'Reactivated.');
      await loadTeachers(true);
    } catch (e) {
      showMsg('teachersMsg', 'error', 'Error: ' + e.message);
    }
  }

  function jumpToAssignments(email) {
    switchTab('assign');
    document.getElementById('asgEmail').value = email;
  }

  // ============================================================
  // ASSIGNMENTS
  // ============================================================
  async function loadAssignments(force) {
    if (!ensurePassword()) return;
    hideMsg('assignMsg');
    if (!force && state.assignments.length) { renderAssignments(); return; }
    try {
      const res = await callGAS('adminListAssignments', { password: state.adminPassword });
      if (!res || !res.success) {
        showMsg('assignMsg', 'error', (res && res.error) || 'Failed.');
        return;
      }
      state.assignments = res.assignments || [];
      renderAssignments();
      populateClassFilter();
    } catch (e) {
      showMsg('assignMsg', 'error', 'Error: ' + e.message);
    }
  }

  function populateClassFilter() {
    const sel = document.getElementById('asgClassFilter');
    const current = sel.value;
    sel.innerHTML = '<option value="">All classes</option>';
    ALL_CLASSES.forEach(c => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    });
    sel.value = current;
  }

  function renderAssignments() {
    const q = (document.getElementById('asgSearch').value || '').toLowerCase().trim();
    const cls = document.getElementById('asgClassFilter').value;
    const rows = state.assignments.filter(a => {
      if (cls && a.studentClass !== cls) return false;
      if (!q) return true;
      return (a.email + ' ' + a.studentClass + ' ' + a.subject + ' ' + a.term)
        .toLowerCase().indexOf(q) !== -1;
    });

    if (!rows.length) {
      document.getElementById('assignTableWrap').innerHTML =
        '<div class="empty">No assignments match your filter.</div>';
      return;
    }

    let h = '<div class="table-wrap"><table><thead><tr>';
    h += '<th>Teacher</th><th>Class</th><th>Subject</th><th>Term</th><th>Active</th><th style="width:100px;"></th>';
    h += '</tr></thead><tbody>';
    rows.forEach(a => {
      h += '<tr>';
      h += '<td style="font-size:12.5px;">' + esc(a.email) + '</td>';
      h += '<td>' + esc(a.studentClass) + '</td>';
      h += '<td><strong>' + esc(a.subject) + '</strong></td>';
      h += '<td>' + esc(a.term) + '</td>';
      h += '<td>' + esc(a.active) + '</td>';
      h += '<td><button class="btn red sm" '
         + 'onclick="removeAssignment(\'' + esc(a.email) + '\',\'' + esc(a.studentClass) + '\',\'' + esc(a.subject) + '\',\'' + esc(a.term) + '\')">'
         + 'Remove</button></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    document.getElementById('assignTableWrap').innerHTML = h;
  }

  // ---- CHANGED: term change also refetches subjects ----
  async function onAsgClassChange() {
    const cls = document.getElementById('asgClass').value;
    const sel = document.getElementById('asgSubject');
    sel.innerHTML = '<option value="">Loading...</option>';
    if (!cls) { sel.innerHTML = ''; return; }
    await loadSubjectsForClass(cls, 'asgSubject');
  }

  // ---- NEW: called when the Term dropdown changes ----
  function onAsgTermChange() {
    state.subjectsCache = {};
    onAsgClassChange();
  }

  async function loadSubjectsForClass(cls, targetSelectId) {
    // Note: subjects are cached per class; if you change term, clear the cache first.
    if (state.subjectsCache[cls]) {
      if (targetSelectId) populateSelect(targetSelectId, state.subjectsCache[cls]);
      return state.subjectsCache[cls];
    }
    try {
      const term = document.getElementById('asgTerm').value || 'ALL';
      const realTerm = term === 'ALL'
        ? (state.terms.find(t => t.isActive) || state.terms[0] || {}).key
        : term;
      const res = await callGAS('adminGetSubjectsForClass', {
        password: state.adminPassword,
        studentClass: cls,
        term: realTerm
      });
      if (!res || !res.success) {
        if (targetSelectId) populateSelect(targetSelectId, []);
        return [];
      }
      state.subjectsCache[cls] = res.subjects || [];
      if (targetSelectId) populateSelect(targetSelectId, state.subjectsCache[cls]);
      return state.subjectsCache[cls];
    } catch (e) {
      if (targetSelectId) populateSelect(targetSelectId, []);
      return [];
    }
  }

  function populateSelect(id, items) {
    const sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = '';
    if (!items || !items.length) {
      const o = document.createElement('option');
      o.value = ''; o.disabled = true; o.selected = true;
      o.textContent = '-- No subjects found --';
      sel.appendChild(o);
      return;
    }
    items.forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = s;
      sel.appendChild(o);
    });
  }

  async function addAssignment() {
    if (!ensurePassword()) return;
    hideMsg('assignMsg');
    const email = document.getElementById('asgEmail').value.trim();
    const cls = document.getElementById('asgClass').value;
    const subject = document.getElementById('asgSubject').value;
    const term = document.getElementById('asgTerm').value || 'ALL';

    if (!email || !cls || !subject) {
      showMsg('assignMsg', 'error', 'All fields required.');
      return;
    }
    try {
      const res = await callGAS('adminAddAssignment', {
        password: state.adminPassword, email, studentClass: cls, subject, term
      });
      if (!res || !res.success) {
        showMsg('assignMsg', 'error', (res && res.error) || 'Failed.');
        return;
      }
      showMsg('assignMsg', 'success', 'Assignment added.');
      await loadAssignments(true);
    } catch (e) {
      showMsg('assignMsg', 'error', 'Error: ' + e.message);
    }
  }

  async function removeAssignment(email, cls, subject, term) {
    if (!ensurePassword()) return;
    if (!confirm('Remove ' + subject + ' for ' + email + ' in ' + cls + '?')) return;
    try {
      const res = await callGAS('adminRemoveAssignment', {
        password: state.adminPassword, email, studentClass: cls, subject, term
      });
      if (!res || !res.success) {
        showMsg('assignMsg', 'error', (res && res.error) || 'Failed.');
        return;
      }
      showMsg('assignMsg', 'success', 'Removed ' + (res.removed || 0) + ' assignment(s).');
      await loadAssignments(true);
    } catch (e) {
      showMsg('assignMsg', 'error', 'Error: ' + e.message);
    }
  }

  // ============================================================
  // BULK ASSIGN
  // ============================================================
  async function initBulkTab() {
    const sel = document.getElementById('bulkClass');
    if (sel.options.length === 0) {
      ALL_CLASSES.forEach(c => {
        const o = document.createElement('option');
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });
    }
    const termSel = document.getElementById('bulkTerm');
    if (termSel.options.length <= 1) {
      state.terms.forEach(t => {
        const o = document.createElement('option');
        o.value = t.key; o.textContent = t.display;
        termSel.appendChild(o);
      });
    }
  }

  // ---- NEW: called when the bulk Term dropdown changes ----
  function onBulkTermChange() {
    state.subjectsCache = {};
    onBulkClassChange();
  }

  async function onBulkClassChange() {
    const cls = document.getElementById('bulkClass').value;
    const wrap = document.getElementById('bulkSubjectsWrap');
    state.bulkSelected.clear();
    updateBulkChips();

    if (!cls) {
      wrap.innerHTML = '<div style="color:#94a3b8;font-size:12px;font-style:italic;padding:8px;">Pick a class first.</div>';
      return;
    }
    wrap.innerHTML = '<div style="color:#94a3b8;font-size:12px;font-style:italic;padding:8px;">Loading subjects...</div>';

    const subs = await loadSubjectsForClass(cls, null);
    wrap.innerHTML = '';
    if (!subs.length) {
      wrap.innerHTML = '<div style="color:#94a3b8;font-size:12px;font-style:italic;padding:8px;">No subjects found for ' + esc(cls) + '.</div>';
      return;
    }
    subs.forEach(s => {
      const label = document.createElement('label');
      label.className = 'checkbox-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = s;
      cb.onchange = function () {
        if (this.checked) state.bulkSelected.add(s);
        else state.bulkSelected.delete(s);
        updateBulkChips();
      };
      const span = document.createElement('span');
      span.textContent = s;
      label.appendChild(cb);
      label.appendChild(span);
      wrap.appendChild(label);
    });
  }

  function updateBulkChips() {
    const wrap = document.getElementById('bulkChips');
    wrap.innerHTML = '';
    if (state.bulkSelected.size === 0) {
      wrap.innerHTML = '<span style="color:#94a3b8;font-size:11.5px;font-style:italic;">None selected</span>';
      return;
    }
    Array.from(state.bulkSelected).sort().forEach(s => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = esc(s) + ' <button type="button" title="Remove">×</button>';
      chip.querySelector('button').onclick = function () {
        state.bulkSelected.delete(s);
        const cb = document.querySelector('#bulkSubjectsWrap input[value="' + CSS.escape(s) + '"]');
        if (cb) cb.checked = false;
        updateBulkChips();
      };
      wrap.appendChild(chip);
    });
  }

  async function saveBulkAssignments() {
    if (!ensurePassword()) return;
    hideMsg('bulkMsg');
    const email = document.getElementById('bulkEmail').value.trim();
    const cls = document.getElementById('bulkClass').value;
    const term = document.getElementById('bulkTerm').value || 'ALL';

    if (!email) { showMsg('bulkMsg', 'error', 'Teacher email is required.'); return; }
    if (!cls)   { showMsg('bulkMsg', 'error', 'Class is required.'); return; }
    if (state.bulkSelected.size === 0) { showMsg('bulkMsg', 'error', 'Select at least one subject.'); return; }

    const subjects = Array.from(state.bulkSelected);
    try {
      const res = await callGAS('adminAddAssignmentsBulk', {
        password: state.adminPassword,
        email: email,
        studentClass: cls,
        subjects: JSON.stringify(subjects),
        term: term
      });
      if (!res || !res.success) {
        showMsg('bulkMsg', 'error', (res && res.error) || 'Failed.');
        return;
      }
      showMsg('bulkMsg', 'success', 'Added ' + res.added + ' assignment(s) for ' + email + ' in ' + cls + '.');
      state.bulkSelected.clear();
      updateBulkChips();
      document.querySelectorAll('#bulkSubjectsWrap input[type=checkbox]').forEach(cb => cb.checked = false);
      await loadAssignments(true);
    } catch (e) {
      showMsg('bulkMsg', 'error', 'Error: ' + e.message);
    }
  }

  // ============================================================
  // AUDIT LOG
  // ============================================================
  async function loadAudit() {
    if (!ensurePassword()) return;
    hideMsg('auditMsg');
    const limit = parseInt(document.getElementById('auditLimit').value, 10) || 200;
    try {
      const res = await callGAS('adminGetAuditLog', {
        password: state.adminPassword,
        limit: limit
      });
      if (!res || !res.success) {
        showMsg('auditMsg', 'error', (res && res.error) || 'Failed.');
        return;
      }
      state.audit = res.log || [];
      renderAudit();
    } catch (e) {
      showMsg('auditMsg', 'error', 'Error: ' + e.message);
    }
  }

  function renderAudit() {
    const q = (document.getElementById('auditSearch').value || '').toLowerCase().trim();
    const rows = state.audit.filter(r => {
      if (!q) return true;
      return (
        (r.teacherName || '') + ' ' +
        (r.teacherEmail || '') + ' ' +
        (r.student || '') + ' ' +
        (r.subject || '') + ' ' +
        (r.studentClass || '')
      ).toLowerCase().indexOf(q) !== -1;
    });

    if (!rows.length) {
      document.getElementById('auditTableWrap').innerHTML =
        '<div class="empty">No entries match your filter.</div>';
      return;
    }

    let h = '<div class="table-wrap"><table><thead><tr>';
    h += '<th>When</th><th>Teacher</th><th>Class</th><th>Subject</th><th>Student</th><th>Old</th><th>New</th>';
    h += '</tr></thead><tbody>';
    rows.forEach(r => {
      const changed = String(r.oldScore) !== String(r.newScore);
      h += '<tr' + (changed ? '' : ' style="opacity:0.6;"') + '>';
      h += '<td style="font-size:12px;color:#94a3b8;white-space:nowrap;">'
        + (r.timestamp ? new Date(r.timestamp).toLocaleString() : '') + '</td>';
      h += '<td>' + esc(r.teacherName || r.teacherEmail) + '</td>';
      h += '<td>' + esc(r.studentClass) + '</td>';
      h += '<td>' + esc(r.subject) + '</td>';
      h += '<td>' + esc(r.student) + '</td>';
      h += '<td style="color:#94a3b8;">' + esc(r.oldScore) + '</td>';
      h += '<td style="color:#fbbf24;font-weight:700;">' + esc(r.newScore) + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    document.getElementById('auditTableWrap').innerHTML = h;
  }

  // ============================================================
  // Init
  // ============================================================
  window.addEventListener('load', async function () {
    // Populate class dropdowns
    ['asgClass','bulkClass'].forEach(id => {
      const sel = document.getElementById(id);
      if (!sel) return;
      sel.innerHTML = '';
      ALL_CLASSES.forEach(c => {
        const o = document.createElement('option');
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });
    });

    // Fetch terms and populate dropdowns
    try {
      const terms = await callGAS('getAvailableTerms', {});
      if (Array.isArray(terms)) {
        state.terms = terms;
        ['asgTerm','bulkTerm'].forEach(id => {
          const sel = document.getElementById(id);
          if (!sel) return;
          sel.innerHTML = '<option value="ALL">ALL TERMS</option>';
          terms.forEach(t => {
            const o = document.createElement('option');
            o.value = t.key; o.textContent = t.display;
            sel.appendChild(o);
          });
        });
      }
    } catch (e) {}

    // Load teachers (also prompts for password the first time)
    loadTeachers();

    // NEW: auto-load subjects for the default class after a short delay
    // (gives loadTeachers() time to cache the admin password)
    setTimeout(() => {
      onAsgClassChange();
      onBulkClassChange();
    }, 500);
  });
</script>
